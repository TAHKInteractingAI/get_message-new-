name: Get_message

on:
  repository_dispatch:
    types: [run-teams-bot]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn về máy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Python 3.10 / 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Cài đặt Google Chrome ổn định
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      # 4. Cài đặt các thư viện Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install undetected-chromedriver selenium gspread gspread-formatting google-auth python-dotenv pytz; fi

      # 5. Chạy script Python (Đã sửa tên Secret trùng khớp với Repository Secrets)
      - name: Run the main script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_SA_KEY: ${{ secrets.GCP_CREDENTIALS_JSON }}
          TEAMS_EMAIL: ${{ secrets.TEAMS_EMAIL }}
          TEAMS_PASSWORD: ${{ secrets.TEAMS_PASSWORD }}
        run: python get_message-new-.py

      # 6. Tải ảnh screenshot lên nếu xảy ra lỗi (Chỉ chạy khi bị Failure)
      - name: Upload Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ./*.png
          retention-days: 7
